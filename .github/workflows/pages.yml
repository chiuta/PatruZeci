name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that index.html is up to date with src/
        run: |
          cp index.html /tmp/index.committed.html
          python3 tools/build.py
          cmp index.html /tmp/index.committed.html
      - name: Prepare site
        run: mkdir _site && cp index.html LICENSE manifest.webmanifest sw.js app.json icon-192.png icon-512.png icon-maskable-512.png _site/ && cp -r docs _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
